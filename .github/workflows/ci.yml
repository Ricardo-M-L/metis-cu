name: CI

on:
  push:
    branches: [main, audit-fixes]
  pull_request:
    branches: [main, audit-fixes]

permissions:
  contents: read

jobs:
  test:
    name: Build & test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # cgo deps (robotgo, screenshot) require platform SDKs — Linux
        # needs x11 dev headers (installed below), Windows uses the
        # mingw toolchain that setup-go ships, macOS uses the system
        # frameworks. Tests gated on a GUI session use Skip in -short
        # mode; CI here runs without -short, so headless runners still
        # exercise the platform-specific input paths via the real OS
        # APIs (where available).
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Linux X11 deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxtst-dev libxkbcommon-dev libpng-dev xorg-dev

      - name: gofmt
        shell: bash
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "gofmt found unformatted files:"
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test -count=1 -timeout 120s ./...
